<!DOCTYPE html><html><head><title>MChat</title><meta name="viewport" content="width=device-width, initial-scale=1"><style>body {  font-family: Arial;  background: #eef2ff;  text-align: center;  padding: 30px;}.container {  background: white;  padding: 25px;  border-radius: 15px;  max-width: 350px;  margin: auto;}input {  width: 90%;  padding: 12px;  margin: 10px 0;  box-sizing: border-box;}button {  padding: 12px 20px;  margin: 8px;  background: #2563eb;  color: white;  border: none;  border-radius: 7px;}#message {  overflow-wrap: anywhere;}</style></head><body><div class="container"><h1>MChat</h1><h3>Create Account / Login</h3><input type="email" id="email" placeholder="Email"><input type="password" id="password" placeholder="Password"><br><button id="signup">Create Account</button><button id="login">Login</button><p id="message">Welcome to MChat</p></div><script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script><script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-auth-compat.js"></script><script>const firebaseConfig = {  apiKey: "AIzaSyCPZRDlZSiP_pPcPg8LAo2JI-9VUlu9S9w",  authDomain: "mchat-f7ac6.firebaseapp.com",  databaseURL: "https://mchat-f7ac6-default-rtdb.asia-southeast1.firebasedatabase.app",  projectId: "mchat-f7ac6",  storageBucket: "mchat-f7ac6.firebasestorage.app",  messagingSenderId: "548889271375",  appId: "1:548889271375:web:afa1270087871686725e3a",  measurementId: "G-E5J7H9WC2E"};firebase.initializeApp(firebaseConfig);const auth = firebase.auth();const message = document.getElementById("message");document.getElementById("signup").onclick = function() {  const email = document.getElementById("email").value.trim();  const password = document.getElementById("password").value;  if (!email || !password) {    message.innerText = "Enter email and password";    return;  }  auth.createUserWithEmailAndPassword(email, password)    .then(() => {      message.innerText = "Account created successfully!";    })    .catch(error => {      message.innerText = error.message;    });};document.getElementById("login").onclick = function() {  const email = document.getElementById("email").value.trim();  const password = document.getElementById("password").value;  if (!email || !password) {    message.innerText = "Enter email and password";    return;  }  auth.signInWithEmailAndPassword(email, password)    .then(() => {      message.innerText = "Login successful!";    })    .catch(error => {      message.innerText = error.message;    });};</script></body></html>
